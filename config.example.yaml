server:
  listen_address: ":8080"
  admin_address: "127.0.0.1:8081"
  request_timeout: 5s
  max_body_bytes: 10485760
  max_batch_size: 100
  websocket_queue_size: 256

redis:
  url_env: REDIS_URL
  key_prefix: rpc-proxy
  leader_ttl: 5s
  stream_max_length: 4096

datadog:
  enabled: true
  statsd_address: "127.0.0.1:8125"
  agent_address: "127.0.0.1:8126"
  service: rpc-proxy
  environment: production
  version: dev
  profiling_enabled: false

chains:
  - name: ethereum
    family: evm
    chain_id: "0x1"
    block_time: 12s
    poll_interval: 2s # Latest HTTP fallback; skipped per upstream while newHeads is healthy.
    head_request_timeout: 2s
    websocket_idle_timeout: 20s # Restore HTTP fallback if no new verified head arrives.
    max_head_age: 30s
    reorg_depth: 64
    upstreams:
      - id: provider-a
        http_url_env: ETHEREUM_PROVIDER_A_HTTP_URL
        websocket_url_env: ETHEREUM_PROVIDER_A_WS_URL
        # header_envs:
        #   Authorization: ETHEREUM_PROVIDER_A_AUTHORIZATION
        max_concurrency: 256
      - id: provider-b
        http_url_env: ETHEREUM_PROVIDER_B_HTTP_URL
        websocket_url_env: ETHEREUM_PROVIDER_B_WS_URL
        max_concurrency: 256

  - name: solana
    family: solana
    genesis_hash: "5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp"
    block_time: 400ms
    poll_interval: 400ms
    head_request_timeout: 2s
    max_head_age: 5s
    reorg_depth: 64
    upstreams:
      - id: provider-a
        http_url_env: SOLANA_PROVIDER_A_HTTP_URL
        max_concurrency: 256
      - id: provider-b
        http_url_env: SOLANA_PROVIDER_B_HTTP_URL
        max_concurrency: 256
