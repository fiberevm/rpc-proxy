# Copy to rpc-proxy.yaml and replace the example provider URLs with your endpoints.
# Keep real credentials in that ignored local file, not in this committed example.
# For one QuickNode multichain URL, see config.quicknode.example.yaml.
# Optional bounded client labels; callers send X-RPC-Client or ?client=.
# clients: [wallet, indexer]
server:
  listen_address: ":8080"
  admin_address: "127.0.0.1:8081"
  request_timeout: 5s
  max_body_bytes: 10485760
  max_batch_size: 100
  websocket_queue_size: 256

# Per-process cache for hash-pinned EVM reads, verified receipts and ancestry headers.
cache:
  disabled: false
  max_entries: 4096
  max_bytes: 67108864 # 64 MiB for retained keys, results and upstream IDs.
  max_entry_bytes: 1048576 # Larger results are returned but not retained.
  ttl: 5m # Retention only; latest reads still select a fresh head on every request.

redis:
  url: "redis://127.0.0.1:6379/0"
  key_prefix: rpc-proxy
  leader_ttl: 5s
  stream_max_length: 4096

datadog:
  enabled: true
  statsd_address: "127.0.0.1:8125"
  agent_address: "127.0.0.1:8126"
  service: rpc-proxy
  environment: production
  version: dev
  profiling_enabled: false

chains:
  - name: ethereum
    family: evm
    chain_id: "0x1"
    block_time: 12s
    poll_interval: 2s # Latest HTTP fallback; skipped per upstream while newHeads is healthy.
    head_request_timeout: 2s
    websocket_idle_timeout: 20s # Restore HTTP fallback if no new verified head arrives.
    max_head_age: 30s
    reorg_depth: 64 # Also bounds numeric block selection and receipt-cache ancestry walks.
    upstreams:
      - id: provider-a
        http_url: "https://ethereum-a.example.invalid/rpc"
        websocket_url: "wss://ethereum-a.example.invalid/ws"
        # headers:
        #   Authorization: "Bearer REPLACE_WITH_YOUR_TOKEN"
        max_concurrency: 256
      - id: provider-b
        http_url: "https://ethereum-b.example.invalid/rpc"
        websocket_url: "wss://ethereum-b.example.invalid/ws"
        max_concurrency: 256

  - name: solana
    family: solana
    genesis_hash: "5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp"
    block_time: 400ms
    poll_interval: 400ms
    head_request_timeout: 2s
    max_head_age: 5s
    reorg_depth: 64
    upstreams:
      - id: provider-a
        http_url: "https://solana-a.example.invalid/rpc"
        max_concurrency: 256
      - id: provider-b
        http_url: "https://solana-b.example.invalid/rpc"
        max_concurrency: 256
