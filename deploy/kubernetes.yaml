# Build and push the repository's Dockerfile, then replace the image below.
# Create the rpc-proxy-secrets Secret in the same namespace before applying.
# See docs/deployment.md for commands and required keys.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rpc-proxy
  labels:
    app.kubernetes.io/name: rpc-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rpc-proxy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rpc-proxy
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rpc-proxy
          image: ghcr.io/your-org/rpc-proxy:replace-me
          imagePullPolicy: IfNotPresent
          args: ["-config", "/etc/rpc-proxy/config.yaml"]
          envFrom:
            - secretRef:
                name: rpc-proxy-secrets
          ports:
            - name: rpc
              containerPort: 8080
            - name: admin
              containerPort: 8081
          # Startup/liveness measure the process; readiness also checks Redis,
          # accepted head freshness, upstream eligibility, and pending reorgs.
          startupProbe:
            httpGet:
              path: /health/live
              port: admin
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: admin
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: admin
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: rpc-proxy
  labels:
    app.kubernetes.io/name: rpc-proxy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rpc-proxy
  # Keep the admin API off the client-facing Service.
  ports:
    - name: rpc
      port: 8080
      targetPort: rpc
